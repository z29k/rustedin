name: Bug report
description: Report a problem with rustedin
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
        ⚠️ **Never paste the contents of `rustedin.json`, access tokens or client secrets.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I run `rustedin ...`, I get ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran (redact any secrets/tokens).
      placeholder: |
        1. rustedin setup ...
        2. rustedin auth ...
        3. rustedin post ...
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rustedin version
      description: Output of `rustedin --version`.
      placeholder: rustedin 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: stderr output (redact tokens/secrets). This will be rendered as code.
      render: shell
